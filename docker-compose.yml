# CS-09: local production-like stack for ESP-v2.
#
# Services:
#   app        — PHP 8.3-fpm + nginx + supervisord (image built here)
#   worker     — same image, runs artisan queue:work under supervisord
#   scheduler  — same image, runs artisan schedule:run loop
#   postgres   — Postgres 15 with a persistent named volume
#   redis      — cache + queue + session store
#   minio      — S3-compatible object storage (satisfies
#                ProductionSafety::checkFilesystemDisk)
#
# Runs with APP_ENV=staging (not production) on purpose: local dev
# secrets don't clear ProductionSafety's real-provider requirements
# for payment + JEA verifier. Staging keeps every safety gate that
# matters for a local smoke test without needing real gateway
# credentials.
#
# `version:` key removed — obsolete since Compose v2.

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: esp-v2:cs09
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      APP_NAME: ESP-v2
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: base64:F2eYlmqx9rGvBH1qhtcJKtOZG7oWYPT1LAK5rY6yEBQ=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: esp_v2
      DB_USERNAME: esp
      DB_PASSWORD: esp_local_dev_only
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: minio_dev
      AWS_SECRET_ACCESS_KEY: minio_dev_secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: esp-v2
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: log
      CAPTCHA_ENABLED: "true"
      SANCTUM_EXPIRATION_MINUTES: 480
      SESSION_SECURE_COOKIE: "false"
      SESSION_HTTP_ONLY: "true"
      GSB_ALLOWED_IPS: "127.0.0.1/32"
      NASHMI_SIGNING_SECRET: local_only_do_not_deploy_this_secret
      NASHMI_ALLOWED_IPS: "127.0.0.1/32"
      PASSWORD_CHECK_COMPROMISED: "false"

  worker:
    image: esp-v2:cs09
    depends_on:
      app:
        condition: service_healthy
    command: ["supervisord", "-c", "/etc/supervisor/queue-worker-only.conf"]
    environment: &app-env
      # APP_NAME must match the app container's — Laravel derives the
      # Redis key prefix from a slug of APP_NAME, so mismatched names
      # produce two disjoint queue namespaces (app dispatches to
      # esp-v2-database-*, worker polls laravel-database-*).
      APP_NAME: ESP-v2
      APP_ENV: staging
      APP_KEY: base64:F2eYlmqx9rGvBH1qhtcJKtOZG7oWYPT1LAK5rY6yEBQ=
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: esp_v2
      DB_USERNAME: esp
      DB_PASSWORD: esp_local_dev_only
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: minio_dev
      AWS_SECRET_ACCESS_KEY: minio_dev_secret
      AWS_BUCKET: esp-v2
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: log

  scheduler:
    image: esp-v2:cs09
    depends_on:
      app:
        condition: service_healthy
    command: ["supervisord", "-c", "/etc/supervisor/scheduler.conf"]
    environment: *app-env

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: esp_v2
      POSTGRES_USER: esp
      POSTGRES_PASSWORD: esp_local_dev_only
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "esp", "-d", "esp_v2"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  minio_data:
