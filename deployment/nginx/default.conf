## CS-09: nginx server block for the Docker runtime stack.
## Listens on :80 inside the container; docker-compose exposes it
## to the host. PHP requests fan out to php-fpm at 127.0.0.1:9000
## (both processes live in the same container under supervisord).

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 50M;

    # Health probes exposed by Laravel:
    #   GET /up          → Laravel default liveness
    #   GET /api/ready   → L-12 readiness (DB + cache round-trip)
    location = /up {
        try_files $uri /index.php?$query_string;
    }
    location = /api/ready {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
