; CS-09: supervisord config for the Docker runtime stack.
; Runs three processes in one container:
;   • php-fpm      — application runtime (SAPI = fpm)
;   • nginx        — reverse proxy at :80
;   • queue worker — via a separate service in docker-compose using
;                    deployment/supervisor/queue-worker.conf
;
; Kept intentionally small — one process per program, no forking.
; Container-native logging via /dev/stdout so `docker compose logs`
; sees everything without needing a volume.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config=/usr/local/etc/php-fpm.d/www.conf
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
