; CS-09: minimal php-fpm pool config for the container.
; The php:8.3-fpm-alpine image ships www.conf.default but not
; www.conf, so `php-fpm --fpm-config=/usr/local/etc/php-fpm.d/www.conf`
; fails "no listen address have been defined". Copy this in the
; Dockerfile so the runtime has an active pool at 127.0.0.1:9000
; where nginx forwards requests.

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
